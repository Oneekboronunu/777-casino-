<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#BA2649" />
      <stop offset="70%" stopColor="#381523" />
      <stop offset="100%" stopColor="#12060C" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFE066" />
      <stop offset="35%" stopColor="#F5B301" />
      <stop offset="70%" stopColor="#9E6E00" />
      <stop offset="100%" stopColor="#FFF2A3" />
    </linearGradient>
    <radialGradient id="chipCenter" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#FFF4B8" />
      <stop offset="30%" stopColor="#F4BE1B" />
      <stop offset="75%" stopColor="#B37800" />
      <stop offset="100%" stopColor="#664400" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#FFF6B3" />
      <stop offset="100%" stopColor="#E69F00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Casino Felt Badge Shape -->
  <rect width="128" height="128" rx="28" fill="url(#bgGlow)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#goldBorder)" stroke-width="3" opacity="0.9" />

  <!-- Outer Casino Token Cog Ring -->
  <circle cx="64" cy="64" r="50" fill="#240B16" stroke="url(#goldBorder)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Dashed Chip Border -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#FFE066" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Center Golden Disc -->
  <circle cx="64" cy="64" r="38" fill="url(#chipCenter)" stroke="#FFE066" stroke-width="2" />

  <!-- Mini Crown over 777 -->
  <path d="M52 42 L56 46 L64 40 L72 46 L76 42 L76 47 L52 47 Z" fill="#FFFDF0" filter="drop-shadow(0 1px 1px rgba(0,0,0,0.5))" />

  <!-- 777 Triple Seven Typography -->
  <text x="64" y="74" text-anchor="middle" font-size="28" font-weight="900" font-family="'Impact', 'Arial Black', sans-serif" letter-spacing="-1.5" fill="url(#textGrad)" stroke="#4A2F00" stroke-width="1.2">
    777
  </text>

  <!-- Stars under 777 -->
  <g fill="#FFFDF0" opacity="0.9">
    <polygon points="52,81 54,84 57,84 55,86 56,89 52,87 48,89 49,86 47,84 50,84" />
    <polygon points="64,79 66,82 70,82 67,84 68,88 64,86 60,88 61,84 58,82 62,82" />
    <polygon points="76,81 78,84 81,84 79,86 80,89 76,87 72,89 73,86 71,84 74,84" />
  </g>

  <!-- Specular highlight arc -->
  <path d="M28 50 C36 32, 50 24, 72 24 C86 24, 96 29, 102 36 C92 28, 78 26, 62 28 C46 30, 34 38, 28 50 Z" fill="#FFFFFF" opacity="0.45" />
</svg>
